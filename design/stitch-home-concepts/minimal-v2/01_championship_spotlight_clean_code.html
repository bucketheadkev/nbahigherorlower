<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>1B Run — Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          colors: {
            brand: {
              blue: '#1A7DFF',
              emerald: '#10B981',
              gold: '#F59E0B',
            }
          }
        }
      }
    }
  </script>
<style>
    /* iOS Safe Area & Native App Shell constraints */
    :root {
      --sat: env(safe-area-inset-top, 54px);
      --sab: env(safe-area-inset-bottom, 34px);
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .text-glow {
      text-shadow: 0 0 28px rgba(255, 255, 255, 0.35);
    }
    .money-glow {
      text-shadow: 0 0 22px rgba(16, 185, 129, 0.55);
    }
    .glass-pill {
      background: rgba(18, 22, 31, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .frosted-glass-card {
      background: linear-gradient(180deg, rgba(22, 27, 36, 0.72) 0%, rgba(12, 16, 24, 0.84) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
    .play-btn-glow {
      box-shadow: 0 14px 34px -4px rgba(26, 125, 255, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }
    .modes-btn-glow {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="bg-black text-white h-full w-full overflow-hidden flex flex-col font-sans antialiased">
<!-- iPhone Native App Wrapper (393x852 ratio viewport frame container) -->
<div class="relative w-full h-full max-w-[430px] mx-auto overflow-hidden flex flex-col justify-between bg-black">
<!-- 3. HERO ATMOSPHERE: Championship Spotlight Arena Background -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<!-- Arena Image Asset with Single Dramatic Spotlight Hoop -->
<img alt="Cinematic dramatic empty NBA championship basketball arena court at night" class="w-full h-full object-cover object-center scale-[1.01]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7aSTAsdHCM7euSVDDAKecqvVrm_iIc9Gfbza5IxqmWq2X32wdWl4c8Ki7VZuph7T7pN8JJeQQ3vgRHdEQbGKcgtjGGKyV9aE6LLshrb3H1DaH35C9vWLNO8kDjhJ_VuREopqJFzXKrg-WYPoj_fx71NPKgVaI1m89YoSnIgCP-xVEJq1Fmk9dIVwLH2NIqkh3Ms2xAV1WMpS39z37JYWjSuKsFEXigNnhLJVO-OyXjRnhnybvBWevakTWLM2ktw"/>
<!-- Rich dark gradient overlay: Top vignette and bottom fade for maximum UI contrast -->
<div class="absolute inset-0 bg-gradient-to-b from-black/85 via-black/35 to-black/95"></div>
<div class="absolute inset-0 bg-radial from-transparent via-black/20 to-black/75"></div>
<!-- Subtle top spotlight bloom -->
<div class="absolute -top-16 left-1/2 -translate-x-1/2 w-[320px] h-[200px] bg-blue-500/10 blur-[90px] rounded-full pointer-events-none"></div>
</div>
<!-- MAIN FOREGROUND CONTAINER -->
<div class="relative z-10 flex flex-col h-full justify-between pt-[calc(env(safe-area-inset-top,48px)+8px)] pb-[calc(env(safe-area-inset-bottom,34px)+10px)] px-5">
<!-- ================= 1. TOP BAR ================= -->
<header class="w-full flex items-center justify-between gap-3">
<!-- Left: Profile pill (K. Bryant, lvl 14, avatar placeholder, subtle progress bar) -->
<div class="flex items-center gap-2.5 glass-pill rounded-full py-1.5 pl-1.5 pr-3.5 shadow-lg">
<!-- Circular Profile Avatar with Level Badge -->
<div class="relative flex-shrink-0">
<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-slate-600 via-slate-500 to-slate-400 p-[1px] shadow-sm">
<div class="w-full h-full rounded-full bg-[#111622] flex items-center justify-center overflow-hidden">
<svg class="w-4 h-4 text-slate-300" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"></path>
</svg>
</div>
</div>
<!-- Small Level Badge -->
<span class="absolute -bottom-1 -right-1 bg-white text-black font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center shadow">
              14
            </span>
</div>
<!-- User Name & Subtle XP progress bar -->
<div class="flex flex-col min-w-[76px]">
<span class="text-[12px] font-bold text-white tracking-tight">K. Bryant</span>
<div class="w-full h-[3px] bg-white/10 rounded-full mt-1 overflow-hidden">
<div class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full" style="width: 68%;"></div>
</div>
</div>
</div>
<!-- Right: Gold coin pill + hamburger icon -->
<div class="flex items-center gap-2">
<!-- Gold coin pill (148,250 with plus icon) -->
<div class="flex items-center gap-2 glass-pill rounded-full py-1.5 pl-3 pr-1.5 shadow-lg">
<!-- Gold Coin Icon -->
<div class="w-4 h-4 rounded-full bg-amber-400 flex items-center justify-center shadow-[0_0_8px_rgba(251,191,36,0.55)]">
<span class="text-[10px] font-black text-black leading-none">$</span>
</div>
<!-- Balance -->
<span class="text-[13px] font-semibold tracking-tight text-white font-mono">148,250</span>
<!-- Purchase "+" button -->
<button class="w-5 h-5 rounded-full bg-white/15 hover:bg-white/25 active:scale-95 transition-all flex items-center justify-center text-white/90">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Hamburger icon on far right -->
<button aria-label="Menu" class="w-9 h-9 glass-pill rounded-full flex items-center justify-center active:scale-95 transition-transform hover:bg-white/10 shadow-lg">
<svg class="w-4 h-4 text-slate-200" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3.75 9h16.5m-16.5 6h16.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- ================= 2. TITLE BLOCK ================= -->
<section class="flex flex-col items-center text-center mt-3 mb-auto pt-4">
<!-- Tag: • SEASON OF THE BILLION -->
<!-- Massive bold "1B RUN" -->
<h1 class="text-[46px] leading-[0.92] font-extrabold tracking-[-0.04em] text-white text-glow font-sans uppercase">
          1B RUN
        </h1>
<!-- Subtitle "CHASE $1 BILLION" ($1 BILLION in vibrant emerald) -->
<p class="text-[12px] tracking-[0.24em] font-bold uppercase mt-2 text-slate-300">
          CHASE <span class="text-emerald-400 font-extrabold money-glow tracking-[0.26em]">$1 BILLION</span>
</p>
</section>
<!-- ================= 4 & 5. ROAD TO $1B CARD + CTA BUTTONS ================= -->
<div class="flex flex-col gap-3.5 w-full mb-3">
<!-- ROAD TO $1 BILLION CARD: Sleek ultra-refined dark frosted glass card -->
<div class="frosted-glass-card rounded-2xl p-4 flex flex-col gap-3">
<!-- Top Row: Label, Amount, and Wall of Fame button -->
<!-- Clean thin progress bar (3.48% filled in teal/emerald glow) -->
<div class="w-full flex flex-col gap-1.5">
<div class="w-full h-[5px] bg-white/[0.08] rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-400 rounded-full shadow-[0_0_12px_rgba(16,185,129,0.7)]" style="width: 3.48%;"></div>
</div>
<!-- Subtitle "Tier 2 Contender" and "3.48% Complete" -->
</div>
</div>
<!-- CTA BUTTONS -->
<div class="flex flex-col gap-2.5 w-full">
<!-- 1) PLAY: Vibrant royal electric blue (#1A7DFF) button with subtle top rim light / inner glow -->
<button class="relative w-full py-4 rounded-2xl bg-gradient-to-r from-[#1A7DFF] via-[#1570ea] to-[#0d63d6] text-white font-bold text-[17px] tracking-wide flex items-center justify-center gap-2.5 play-btn-glow active:scale-[0.98] transition-all overflow-hidden group">
<!-- Subtle top rim light -->
<div class="absolute inset-x-0 top-0 h-[1px] bg-white/40 pointer-events-none"></div>
<!-- Inner gradient glow -->
<div class="absolute inset-0 bg-gradient-to-b from-white/15 to-transparent pointer-events-none"></div>
<svg class="w-5 h-5 fill-white text-white drop-shadow-sm transition-transform group-hover:scale-110" viewbox="0 0 24 24">
<path d="M8 5.14v14.72a1 1 0 001.5.86l11-7.36a1 1 0 000-1.72l-11-7.36A1 1 0 008 5.14z"></path>
</svg>
<span class="tracking-wider">PLAY</span>
</button>
<!-- 2) GAME MODES: Sleek translucent glass pill with fine hairline border, subtle four squares icon -->
<button class="w-full py-3 rounded-2xl modes-btn-glow text-slate-200 font-semibold text-[13px] tracking-wider flex items-center justify-center gap-2 active:scale-[0.98] transition-all hover:text-white hover:bg-white/[0.08]">
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>MODES</span>
</button>
</div>
</div>
<!-- ================= 6. BOTTOM NAVIGATION BAR ================= -->
<!-- Floating modern iOS pill dock with backdrop blur (blur-xl bg-black/60 border border-white/10 rounded-full px-6 py-2.5 mx-auto) -->
<nav class="w-full max-w-[390px] mx-auto bg-black/60 backdrop-blur-xl border border-white/10 rounded-full px-3 py-1.5 flex items-center justify-between shadow-[0_16px_36px_rgba(0,0,0,0.85)]">
<!-- Tab 1: Leaderboard -->
<button class="flex-1 py-1.5 px-3 flex flex-col items-center justify-center gap-1 rounded-full text-slate-400 hover:text-slate-200 transition-colors active:scale-95 group">
<svg class="w-5 h-5 text-slate-400 group-hover:text-slate-200 transition-colors" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.004 0V9.75m-5.004 4.5V12m2.5-4.5V4.5m0 0a1.5 1.5 0 011.5 1.5v.75m-3-2.25a1.5 1.5 0 00-1.5 1.5v.75m3 0h-3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-semibold tracking-tight">Leaderboard</span>
</button>
<!-- Tab 2: Home (ACTIVE with soft glowing circular pill backdrop and active indicator dot) -->
<button class="flex-1 py-1.5 px-3 flex flex-col items-center justify-center gap-0.5 rounded-full bg-white/[0.14] text-white shadow-inner active:scale-95 transition-all relative">
<div class="relative flex flex-col items-center justify-center">
<svg class="w-5 h-5 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"></path>
<path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.432z"></path>
</svg>
<span class="w-1 h-1 rounded-full bg-blue-400 mt-0.5"></span>
</div>
<span class="text-[10px] font-bold tracking-tight text-white leading-none">Home</span>
</button>
<!-- Tab 3: Shop -->
<button class="flex-1 py-1.5 px-3 flex flex-col items-center justify-center gap-1 rounded-full text-slate-400 hover:text-slate-200 transition-colors active:scale-95 group">
<svg class="w-5 h-5 text-slate-400 group-hover:text-slate-200 transition-colors" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-semibold tracking-tight">Shop</span>
</button>
</nav>
</div>
<!-- iOS Home Indicator bar -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full pointer-events-none"></div>
</div>
</body></html>
