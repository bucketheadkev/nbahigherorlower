<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>1B Run — Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1A7DFF",
            "background-dark": "#0B0E14",
            obsidian: {
              950: '#06080C',
              900: '#0E131A',
              850: '#131822',
              800: '#18202C'
            },
            mint: {
              400: '#34D399',
              500: '#10B981',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          borderRadius: {
            'squircle': '1.35rem',
          }
        }
      }
    }
  </script>
<style>
    :root {
      --sat: env(safe-area-inset-top, 54px);
      --sab: env(safe-area-inset-bottom, 34px);
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .matte-pill {
      background: rgba(14, 19, 26, 0.76);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .obsidian-card {
      background: rgba(14, 18, 25, 0.88);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .play-btn-obsidian {
      background: linear-gradient(180deg, #2487FF 0%, #1263DE 50%, #0A52C0 100%);
      box-shadow: 0 12px 28px -4px rgba(24, 119, 242, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.42), inset 0 -2px 4px rgba(0, 0, 0, 0.35);
    }
    .modes-btn-matte {
      background: rgba(22, 28, 38, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .text-glow-subtle {
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.28);
    }
    .mint-glow-subtle {
      text-shadow: 0 0 16px rgba(52, 211, 153, 0.45);
    }
  </style>
</head>
<body class="bg-black text-white h-full w-full overflow-hidden flex flex-col font-sans antialiased">
<!-- iPhone Native App Wrapper (Mobile portrait screen) -->
<div class="relative w-full h-full max-w-[430px] mx-auto overflow-hidden flex flex-col justify-between bg-black">
<!-- HERO BACKGROUND: Low-angle architectural obsidian arena with halo jumbotron -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<img alt="Obsidian Architectural Basketball Arena" class="w-full h-full object-cover object-top scale-100" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAI6EHlcIyIZrPTsq4k7W11lWd35mQedexgJnO7nWhBm-ZT3Ihr_Tb6KHIPxJu6j20EEB9OGeX3zP4-DERCzBL45Nii2vTV3x60Tr4g-c71v5Jdu0WRQDj4awtmd0x60zbP5kX0gbxshYjXfh4fGf2D2RkDODeI49U-U01MKN5WTfMM_OusFoKI16OCYpywXRbU43Rvwn9U0vjUcqY8YOn63fA0lpoWMPDt1JLUNQNcsHsTYOAJ4pQT1sJ01mQk-w"/>
<!-- Deep dark obsidian shadows, subtle vignette for high contrast text readability -->
<div class="absolute inset-0 bg-gradient-to-b from-black/85 via-black/35 to-black/95"></div>
<div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_40%,transparent_20%,rgba(0,0,0,0.85)_100%)]"></div>
<div class="absolute bottom-0 inset-x-0 h-96 bg-gradient-to-t from-black via-black/80 to-transparent"></div>
</div>
<!-- MAIN FOREGROUND CONTAINER -->
<div class="relative z-10 flex flex-col h-full justify-between pt-[calc(env(safe-area-inset-top,48px)+8px)] pb-0">
<!-- ================= 1. TOP BAR ================= -->
<header class="w-full flex items-center justify-between gap-3 px-5">
<!-- Left: Profile Pill (K. Bryant, lvl 14, subtle XP bar) -->
<div class="flex items-center gap-2.5 matte-pill rounded-full py-1.5 pl-1.5 pr-3.5">
<div class="relative flex-shrink-0">
<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-zinc-700 via-zinc-600 to-zinc-400 p-[1px] shadow-sm">
<div class="w-full h-full rounded-full bg-[#0C1017] flex items-center justify-center overflow-hidden">
<svg class="w-4 h-4 text-zinc-300" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"></path>
</svg>
</div>
</div>
<!-- Level Badge -->
<span class="absolute -bottom-1 -right-1 bg-white text-black font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center shadow">
              14
            </span>
</div>
<!-- User Name & Subtle XP Progress -->
<div class="flex flex-col min-w-[76px]">
<div class="flex items-center justify-between">
<span class="text-[12px] font-bold text-white tracking-tight">K. Bryant</span>
</div>
<div class="w-full h-[3px] bg-white/10 rounded-full mt-1 overflow-hidden">
<div class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full" style="width: 68%;"></div>
</div>
</div>
</div>
<!-- Right: Gold Coin Pill (148,250 +) + Minimal Menu Button -->
<div class="flex items-center gap-2">
<div class="flex items-center gap-2 matte-pill rounded-full py-1.5 pl-3 pr-1.5">
<!-- Coin Icon -->
<div class="w-4 h-4 rounded-full bg-amber-400 flex items-center justify-center shadow-[0_0_8px_rgba(251,191,36,0.45)]">
<span class="text-[10px] font-black text-black leading-none">$</span>
</div>
<!-- Balance -->
<span class="text-[13px] font-semibold tracking-tight text-white font-mono">148,250</span>
<!-- Purchase "+" button -->
<button aria-label="Add currency" class="w-5 h-5 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition-all flex items-center justify-center text-white/90">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Minimal Menu Button -->
<button aria-label="Menu" class="w-9 h-9 matte-pill rounded-full flex items-center justify-center active:scale-95 transition-transform hover:bg-white/10">
<svg class="w-4 h-4 text-zinc-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3.75 9h16.5m-16.5 6h16.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- ================= 2. TITLE BLOCK ================= -->
<section class="flex flex-col items-center text-center mt-3 mb-auto pt-7 px-5">
<!-- Clean Pill Badge "• SEASON OF THE BILLION" -->
<!-- Crisp Geometric Typography "1B RUN" -->
<h1 class="text-[44px] leading-[0.92] font-extrabold tracking-[-0.04em] text-white text-glow-subtle font-sans uppercase">
          1B RUN
        </h1>
<!-- Subtitle "CHASE $1 BILLION" ($1 BILLION in mint/emerald) -->
<p class="text-[13px] tracking-[0.24em] font-bold uppercase mt-2.5 text-zinc-300">
          CHASE <span class="text-mint-400 font-extrabold mint-glow-subtle tracking-[0.24em]">$1 BILLION</span>
</p>
</section>
<!-- ================= 3. BOTTOM CARDS & ACTIONS ================= -->
<div class="flex flex-col gap-3.5 w-full px-5 mb-3">
<!-- Road to $1 Billion Card: Pure matte obsidian surface with crisp micro-border -->
<div class="obsidian-card rounded-2xl p-4 flex flex-col gap-3">
<!-- Top Row -->
<!-- Slim high-precision progress bar with mint accent -->
<div class="w-full flex flex-col gap-1.5">
<div class="w-full h-[5px] bg-white/[0.08] rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-mint-500 to-mint-400 rounded-full shadow-[0_0_10px_rgba(52,211,153,0.55)]" style="width: 3.48%;"></div>
</div>
</div>
</div>
<!-- CTA Buttons -->
<div class="flex flex-col gap-2.5 w-full">
<!-- 1) PLAY: Tactile, deep gradient royal sapphire squircle button -->
<button class="relative w-full py-3.5 rounded-2xl play-btn-obsidian text-white font-bold text-[17px] tracking-wide flex items-center justify-center gap-2.5 active:scale-[0.985] transition-all overflow-hidden group">
<!-- Play icon -->
<svg class="w-5 h-5 fill-white text-white drop-shadow-sm transition-transform group-hover:scale-105" viewbox="0 0 24 24">
<path d="M8 5.14v14.72a1 1 0 001.5.86l11-7.36a1 1 0 000-1.72l-11-7.36A1 1 0 008 5.14z"></path>
</svg>
<span class="font-extrabold tracking-wider">PLAY</span>
</button>
<!-- 2) GAME MODES: Dark matte graphite button with micro-embossed border and four-square grid icon -->
<button class="w-full py-3 rounded-2xl modes-btn-matte text-zinc-200 font-semibold text-[13.5px] tracking-wider flex items-center justify-center gap-2 active:scale-[0.985] transition-all hover:text-white">
<svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="font-bold">MODES</span>
</button>
</div>
</div>
<!-- ================= 4. BOTTOM NAVIGATION BAR (Flush dock with hairline top border) ================= -->
<nav class="w-full bg-black/85 backdrop-blur-2xl border-t border-white/10 px-5 pt-2 pb-[calc(env(safe-area-inset-bottom,34px)+6px)] flex items-center justify-between">
<!-- Tab 1: Leaderboard -->
<button class="flex-1 py-1.5 flex flex-col items-center justify-center gap-1 text-zinc-400 hover:text-zinc-200 transition-colors active:scale-95 group">
<svg class="w-5 h-5 text-zinc-400 group-hover:text-zinc-200 transition-colors" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.004 0V9.75m-5.004 4.5V12m2.5-4.5V4.5m0 0a1.5 1.5 0 011.5 1.5v.75m-3-2.25a1.5 1.5 0 00-1.5 1.5v.75m3 0h-3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Leaderboard</span>
</button>
<!-- Tab 2: Home (ACTIVE - Illuminated rounded-xl pill badge with subtle vertical glow) -->
<button class="flex-1 py-1 flex flex-col items-center justify-center active:scale-95 transition-all">
<div class="w-16 py-1 rounded-xl bg-white/[0.12] border border-white/10 shadow-[0_0_16px_rgba(26,125,255,0.25)] flex flex-col items-center justify-center gap-0.5">
<svg class="w-5 h-5 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"></path>
<path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.432z"></path>
</svg>
<span class="text-[9.5px] font-bold tracking-tight text-white">Home</span>
</div>
</button>
<!-- Tab 3: Shop -->
<button class="flex-1 py-1.5 flex flex-col items-center justify-center gap-1 text-zinc-400 hover:text-zinc-200 transition-colors active:scale-95 group">
<svg class="w-5 h-5 text-zinc-400 group-hover:text-zinc-200 transition-colors" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Shop</span>
</button>
</nav>
</div>
<!-- iOS Home Indicator bar -->
<div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full pointer-events-none z-20"></div>
</div>
</body></html>
