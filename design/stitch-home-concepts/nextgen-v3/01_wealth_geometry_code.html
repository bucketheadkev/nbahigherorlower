<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_tab" name="shell-type"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&amp;family=Inter:wght@400;500;600;700;800&amp;family=Public+Sans:wght@700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#010814',
            vault: '#020F2B',
            navy: {
              950: '#010814',
              900: '#020F2B',
              800: '#071A40'
            },
            primary: '#E55622',
            'primary-bright': '#FF6525',
            wealth: '#00FF66',
            'wealth-emerald': '#10B981',
            gold: '#F5C518'
          },
          fontFamily: {
            athletic: ['"Barlow Condensed"', 'sans-serif'],
            display: ['"Public Sans"', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
<style>
    @layer base {
      html, body {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #010814;
        color: #F0F4FC;
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overscroll-behavior-y: none;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 8px); }
    }
    ::-webkit-scrollbar { display: none; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }

    /* Wealth Geometric Lines & Perspective Grid */
    .vault-grid {
      background-image: 
        radial-gradient(circle at 50% 32%, rgba(229, 86, 34, 0.16) 0%, transparent 60%),
        radial-gradient(circle at 50% 68%, rgba(0, 255, 102, 0.12) 0%, transparent 55%),
        linear-gradient(to right, rgba(0, 255, 102, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(229, 86, 34, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    /* Metallic chiseled bevel text */
    .bevel-text-green {
      background: linear-gradient(180deg, #E6FFF2 0%, #00FF66 48%, #059648 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(0, 255, 102, 0.6));
    }
  </style>
</head>
<body class="bg-[#010814] text-slate-100 flex flex-col min-h-screen relative selection:bg-primary selection:text-white overflow-x-hidden vault-grid">
<!-- TOP BAR / HEADER (KEVBUCKET, LVL 8, COIN BADGE, MENU) -->
<header class="fixed top-0 inset-x-0 z-50 pt-safe bg-[#010814]/85 backdrop-blur-xl border-b border-white/5">
<div class="h-16 px-4 max-w-md mx-auto flex items-center justify-between">
<!-- User Profile Pill: Avatar "KEVBUCKET", Level 8 with glowing orange XP bar -->
<div class="flex items-center gap-2.5 bg-gradient-to-r from-[#031333]/90 to-[#071F47]/70 border border-slate-700/50 pl-1.5 pr-3 py-1.5 rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.6)] backdrop-blur-md">
<!-- Avatar Ring -->
<div class="relative w-8 h-8 rounded-full bg-gradient-to-br from-[#FF7A45] via-[#E55622] to-[#B3350A] p-[1.5px] shadow-[0_0_10px_rgba(229,86,34,0.6)] shrink-0">
<div class="w-full h-full rounded-full bg-[#020F2B] flex items-center justify-center">
<span class="material-symbols-outlined text-[19px] text-[#FF8A54]">person</span>
</div>
</div>
<!-- Name & XP Bar -->
<div class="flex flex-col">
<span class="font-athletic text-[13px] font-black tracking-wider uppercase text-white leading-tight">KEVBUCKET</span>
<div class="flex items-center gap-1.5">
<span class="font-athletic text-[10px] font-black text-[#8E9EB8] tracking-widest leading-none">LV. 8</span>
<!-- Glowing Orange XP Bar -->
<div class="w-14 h-1.5 bg-[#020914] rounded-full overflow-hidden p-[0.5px] border border-orange-500/30">
<div class="h-full bg-gradient-to-r from-[#FF7A45] to-[#E55622] rounded-full shadow-[0_0_8px_rgba(229,86,34,0.9)]" style="width: 65%;"></div>
</div>
</div>
</div>
</div>
<!-- Right Side: Coin Capsule Badge ("$1B" coin icon + count "125" + gold/orange "+" button) & Sleek Hamburger -->
<div class="flex items-center gap-2">
<div class="h-9 pl-1.5 pr-1 rounded-full bg-gradient-to-r from-[#082046]/90 to-[#031331]/90 border border-cyan-400/25 flex items-center gap-1.5 shadow-[0_0_14px_rgba(2,15,43,0.8),inset_0_1px_1px_rgba(255,255,255,0.2)]">
<!-- Metallic $1B Coin Icon -->
<div class="w-6 h-6 rounded-full bg-gradient-to-b from-[#F3E7C4] via-[#D4AF37] to-[#8C6D1F] p-[1px] shadow-[0_0_8px_rgba(212,175,55,0.6)] flex items-center justify-center">
<div class="w-full h-full rounded-full bg-gradient-to-br from-[#FFDF00] to-[#996515] flex items-center justify-center text-[#010814] font-athletic text-[9px] font-black italic tracking-tighter">
              1B
            </div>
</div>
<!-- Numeric Count -->
<span class="font-athletic text-sm font-black tracking-wide text-white pr-0.5">125</span>
<!-- Gleaming Metallic Gold/Orange "+" Button -->
<button aria-label="Add funds" class="w-6 h-6 rounded-full bg-gradient-to-b from-[#FFA033] via-[#E55622] to-[#B83E0E] flex items-center justify-center text-white shadow-[0_0_10px_rgba(229,86,34,0.7)] active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[15px] font-black leading-none">add</span>
</button>
</div>
<!-- Sleek Frosted Glass Hamburger Menu Button -->
<button aria-label="Menu" class="w-9 h-9 rounded-xl bg-gradient-to-b from-[#0B2554]/80 to-[#04132F]/90 border border-slate-700/60 flex items-center justify-center shadow-[inset_0_1px_1px_rgba(255,255,255,0.2),0_4px_12px_rgba(0,0,0,0.6)] active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[#D5E0F2] text-[20px]">menu</span>
</button>
</div>
</div>
</header>
<!-- MAIN VIEWPORT CONTAINER -->
<main class="flex-1 flex flex-col relative w-full pt-20 pb-28 max-w-md mx-auto px-4 overflow-hidden">
<!-- ASCENDING VAULT / BASKETBALL COURT WEALTH GEOMETRY HERO ARTWORK -->
<div class="relative w-full rounded-3xl overflow-hidden border border-slate-700/40 bg-gradient-to-b from-[#020F2B] via-[#010B1E] to-[#010814] shadow-[0_20px_50px_rgba(0,0,0,0.85)] p-4 flex flex-col items-center justify-between min-h-[290px]">
<!-- Vector / Procedural Wealth Pillars & Laser Court Hologram (No Generic Stock) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<!-- Top Stadium Floodlight Volumetric Rays -->
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-72 h-44 bg-gradient-to-b from-sky-400/20 via-primary/10 to-transparent blur-2xl"></div>
<div class="absolute top-0 left-6 w-16 h-60 bg-gradient-to-b from-[#00FF66]/15 via-transparent to-transparent -rotate-12 blur-lg"></div>
<div class="absolute top-0 right-6 w-16 h-60 bg-gradient-to-b from-[#00FF66]/15 via-transparent to-transparent rotate-12 blur-lg"></div>
<!-- Ascending Holographic Money-Green Wealth Pillars (Vector Bars) -->
<div class="absolute bottom-16 inset-x-8 flex justify-between items-end opacity-40">
<div class="w-2.5 h-16 bg-gradient-to-t from-transparent via-[#00FF66]/40 to-[#00FF66] rounded-t-full shadow-[0_0_12px_#00FF66]"></div>
<div class="w-2.5 h-24 bg-gradient-to-t from-transparent via-[#00FF66]/50 to-[#00FF66] rounded-t-full shadow-[0_0_14px_#00FF66]"></div>
<div class="w-3 h-36 bg-gradient-to-t from-transparent via-[#00FF66]/70 to-[#00FF66] rounded-t-full shadow-[0_0_18px_#00FF66]"></div>
<div class="w-3.5 h-44 bg-gradient-to-t from-transparent via-[#00FF66]/90 to-white rounded-t-full shadow-[0_0_22px_#00FF66]"></div>
<div class="w-3 h-36 bg-gradient-to-t from-transparent via-[#00FF66]/70 to-[#00FF66] rounded-t-full shadow-[0_0_18px_#00FF66]"></div>
<div class="w-2.5 h-24 bg-gradient-to-t from-transparent via-[#00FF66]/50 to-[#00FF66] rounded-t-full shadow-[0_0_14px_#00FF66]"></div>
<div class="w-2.5 h-16 bg-gradient-to-t from-transparent via-[#00FF66]/40 to-[#00FF66] rounded-t-full shadow-[0_0_12px_#00FF66]"></div>
</div>
<!-- Geometric Glowing Basketball Key / Hoop Arc Overlays -->
<div class="absolute -bottom-14 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full border-2 border-[#E55622]/40 shadow-[0_0_30px_rgba(229,86,34,0.3)]"></div>
<div class="absolute -bottom-6 left-1/2 -translate-x-1/2 w-40 h-40 rounded-full border border-emerald-400/40"></div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[2px] h-32 bg-gradient-to-t from-transparent via-orange-500/60 to-white"></div>
<!-- Laser-cut Metallic Silver Championship Ribbons & Floating Geometric Sparkles -->
<div class="absolute top-8 left-10 w-2 h-2 rounded-full bg-white shadow-[0_0_10px_#FFFFFF] animate-ping"></div>
<div class="absolute top-16 right-12 w-2.5 h-2.5 rounded-full bg-[#00FF66] shadow-[0_0_12px_#00FF66]"></div>
<div class="absolute bottom-20 left-16 w-1.5 h-1.5 rounded-full bg-[#FF7A45] shadow-[0_0_8px_#FF7A45]"></div>
</div>
<!-- BRAND HERO BADGE & PUNCHY CALLOUT -->
<div class="relative z-10 w-full flex flex-col items-center text-center mt-1"><div class="flex flex-col items-center justify-center pt-2 pb-1"><h1 class="font-athletic text-5xl font-black italic tracking-wider uppercase text-white drop-shadow-[0_4px_12px_rgba(0,0,0,0.9)] leading-none">1B RUN</h1><div class="flex items-center gap-2 mt-2 font-athletic text-xl font-black italic tracking-widest uppercase"><span class="text-white/90 drop-shadow-[0_2px_6px_rgba(0,0,0,0.8)]">CHASE</span><span class="text-[#00FF66] bevel-text-green drop-shadow-[0_0_12px_rgba(0,255,102,0.8)]">$1 BILLION</span></div></div></div>
<!-- FLOATING STAT CAPSULES INSIDE ARENA -->
</div>
<!-- "ROAD TO $1 BILLION" PROGRESSION BANK CARD (TITANIUM TRIM + OBSIDIAN GLASS) -->
<div class="w-full mt-3.5 bg-gradient-to-br from-[#061735]/90 via-[#020F2B]/95 to-[#010814]/95 rounded-2xl p-3.5 border border-slate-600/40 shadow-[0_12px_32px_rgba(0,0,0,0.7),inset_0_1px_1px_rgba(255,255,255,0.15)] backdrop-blur-xl relative">
<!-- Card Header: Title & Wall of Fame Pill -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-lg bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-[#00FF66] shadow-[0_0_10px_rgba(0,255,102,0.25)]">
<span class="material-symbols-outlined text-[17px]">account_balance</span>
</div>
<div class="flex flex-col">
<span class="font-athletic text-xs font-black tracking-[0.16em] text-slate-200 uppercase">ROAD TO $1 BILLION</span>
<span class="text-[10px] text-slate-400 font-medium">Franchise Valuation Progress</span>
</div>
</div>
<!-- Wall of Fame Preview Badge with Mini Gold Trophy -->
<button class="h-7 px-2.5 rounded-full bg-gradient-to-b from-[#162744] to-[#0A162B] border border-amber-400/30 flex items-center gap-1 shadow-[0_0_10px_rgba(245,197,24,0.2)] active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[#F5C518] text-[15px]">military_tech</span>
<span class="font-athletic text-[10px] font-black tracking-wider text-white uppercase">WALL OF FAME</span>
</button>
</div>
<!-- Current Net Worth Stats -->
<div class="flex items-baseline justify-between pt-2.5 pb-1">
<div class="flex items-baseline gap-1.5">
<span class="font-athletic text-2xl font-black tracking-tight text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]" id="valuationAmount">$14,850,200</span>
<span class="font-athletic text-xs font-bold text-slate-400">/ $1,000,000,000</span>
</div>
</div>
<!-- Electric Green Gradient Milestone Bar -->
<div class="w-full h-3 bg-[#010712] rounded-full p-[2px] border border-emerald-500/20 shadow-inner overflow-hidden relative">
<div class="h-full bg-gradient-to-r from-[#059648] via-[#00FF66] to-[#A3FFD0] rounded-full shadow-[0_0_14px_rgba(0,255,102,0.8)] relative transition-all duration-700" style="width: 14.2%;">
<div class="absolute right-0 top-0 bottom-0 w-2.5 bg-white rounded-full blur-[1px] shadow-[0_0_6px_#FFFFFF]"></div>
</div>
</div>
<!-- Next Milestone Target Hint -->
</div>
<!-- PRIMARY ACTION BUTTONS: TACTILE ORANGE PLAY + METALLIC MODES PILL -->
<div class="w-full space-y-2.5 pt-3">
<!-- VIBRANT BASKETBALL ORANGE CAPSULE PLAY BUTTON (NEVER BLUE) -->
<button class="group relative w-full h-[62px] rounded-full bg-gradient-to-b from-[#FFA254] via-[#FF601C] to-[#BA3500] p-[2px] shadow-[0_10px_35px_rgba(229,86,34,0.65),0_0_20px_rgba(255,96,28,0.4)] active:scale-[0.98] transition-all overflow-hidden" id="mainPlayBtn">
<!-- Inner Beveled Specular Rim & Tactile Fill -->
<div class="w-full h-full rounded-full bg-gradient-to-b from-[#FF6B26] via-[#E55622] to-[#B03405] flex items-center justify-center relative px-6 shadow-[inset_0_2px_4px_rgba(255,255,255,0.45),inset_0_-3px_4px_rgba(0,0,0,0.4)]">
<!-- Top Specular Sheen Stripe -->
<div class="absolute top-1 inset-x-8 h-[2px] bg-gradient-to-r from-transparent via-white/80 to-transparent blur-[0.5px]"></div>
<!-- Play Button Content: Bold Italic "PLAY" + Subtle Play Arrow -->
<div class="flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-white text-[30px] drop-shadow-[0_2px_6px_rgba(0,0,0,0.5)] group-hover:scale-110 transition-transform">
              play_arrow
            </span>
<span class="font-athletic text-3xl font-black italic tracking-wider text-white uppercase drop-shadow-[0_2px_6px_rgba(0,0,0,0.6)]">
              PLAY
            </span>
</div>
</div>
</button>
<!-- SLEEK METALLIC GLASS PILL: "CHOOSE MODE" / "MODES" -->
<button class="w-full h-12 rounded-full bg-gradient-to-b from-[#08234D]/90 via-[#031533]/90 to-[#010C20]/95 border border-cyan-400/30 shadow-[0_6px_20px_rgba(0,0,0,0.5),inset_0_1px_1px_rgba(255,255,255,0.2)] flex items-center justify-between px-5 active:scale-[0.99] transition-transform group"><div class="flex items-center gap-2.5"><div class="w-7 h-7 rounded-full bg-cyan-500/10 border border-cyan-400/30 flex items-center justify-center text-cyan-300"><span class="material-symbols-outlined text-[17px]">layers</span></div><span class="font-athletic text-sm font-black tracking-widest text-white uppercase drop-shadow-sm">MODES</span></div><span class="material-symbols-outlined text-cyan-200 text-[18px] group-hover:translate-x-0.5 transition-transform">chevron_right</span></button>
</div>
</main>
<!-- BOTTOM NAVIGATION: ULTRA-MODERN FLOATING DOCK WITH FROSTED MIDNIGHT GLASS -->
<nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-[#010814]/90 backdrop-blur-2xl border-t border-slate-800/80 shadow-[0_-8px_30px_rgba(0,0,0,0.7)]" data-active-classes="text-primary [filter:drop-shadow(0_0_12px_rgba(229,86,34,0.65))]">
<div class="flex justify-around items-center h-16 px-6 max-w-md mx-auto relative">
<!-- Leaderboard (Bar chart icon) -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[72px] text-slate-400 hover:text-white transition-all group" data-path="leaderboard" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">
          bar_chart
        </span>
<span class="text-[10px] font-athletic font-extrabold tracking-widest uppercase">
          LEADERBOARD
        </span>
</a>
<!-- Home (Central Radiant Orange Active State Capsule) -->
<a aria-current="page" class="relative -top-2 flex flex-col items-center justify-center group" data-path="home" href="#">
<!-- Micro-lens Rim Glow & Radiant Orange Dock Indicator -->
<div class="w-14 h-12 rounded-full bg-gradient-to-b from-[#FF7A45] via-[#E55622] to-[#B3350A] p-[1.5px] shadow-[0_0_20px_rgba(229,86,34,0.7)] flex items-center justify-center transition-transform group-hover:scale-105 active:scale-95">
<div class="w-full h-full rounded-full bg-gradient-to-b from-[#FF6B2B] to-[#C7400F] flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-white text-[28px] drop-shadow-md">
              play_arrow
            </span>
</div>
</div>
<span class="text-[10px] font-athletic font-black tracking-widest text-[#FF7A45] uppercase mt-0.5">
          HOME
        </span>
</a>
<!-- Shop (Shopping cart / Diamond icon) -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[72px] text-slate-400 hover:text-white transition-all group" data-path="shop" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">
          shopping_cart
        </span>
<span class="text-[10px] font-athletic font-extrabold tracking-widest uppercase">
          SHOP
        </span>
</a>
</div>
</nav>
<script>
    (function() {
      const mainPlayBtn = document.getElementById('mainPlayBtn');
      if (mainPlayBtn) {
        mainPlayBtn.addEventListener('click', () => {
          mainPlayBtn.classList.add('scale-95');
          setTimeout(() => mainPlayBtn.classList.remove('scale-95'), 120);
        });
      }
    })();
  </script>
</body></html>
